# Пример конфигурации mining-proxy.
# Скопируйте в config.local.yaml (локально) или /etc/mining-proxy/config.yaml
# (systemd) и поправьте подсети майнеров.

# Адрес прокси — сюда приходит трафик майнеров после DNAT.
listen_addr: "0.0.0.0:8443"

# Подсети майнеров (CIDR), трафик которых перехватывается.
# Обязательны при setup_iptables: true.
allowed_subnets:
  - "10.4.6.0/24"

# Автоматически настроить iptables DNAT при старте (нужен root).
# При остановке правила снимаются: трафик уходит напрямую в пул.
# Вместе с DNAT всегда ставится MASQUERADE для трафика allowed_subnets, который
# сервер форвардит дальше (DNS, UDP, порты вне перехвата): без него на сервере-
# шлюзе такой трафик зацикливается между сервером и роутером. Если сервер не
# шлюз, правило ни на что не влияет. При остановке прокси оно не снимается.
setup_iptables: true

# Входящие интерфейсы вручную; пусто = автоопределение по маршруту
# к allowed_subnets.
# nat_ingress_ifaces:
#   - "eth1"

# Перехватывать TCP подсетей на любой порт из диапазона
# capture_port_from..capture_port_to. Нужно, если майнеры ходят на разные
# порты разных пулов. Дефолт true. false — перехват только портов из
# capture_ports (тогда список обязателен, диапазон не используется).
capture_all_tcp: true

# Диапазон портов назначения (включительно) для перехвата при
# capture_all_tcp: true. Дефолт 25..9999. Один порт — одинаковые значения
# (например 9999 и 9999). В iptables это --dport 25:9999.
capture_port_from: 25
capture_port_to: 9999

# Отдельные порты сверх диапазона (пулы на нестандартных портах).
# На каждый порт — своё правило DNAT. Порты внутри диапазона игнорируются.
# При capture_all_tcp: false — единственные перехватываемые порты.
# capture_ports:
#   - 14444
#   - 25000

# Очистка stdout/stderr, если они перенаправлены в файл (nohup.out):
# файл обрезается до нуля раз в указанный период. Дефолт 48h, "0" — выкл.
# Под systemd (journald) не действует.
# stdout_truncate_interval: "48h"

# HTTP-мониторинг (/status, /health). Не выставляйте наружу без firewall.
monitor_addr: "127.0.0.1:9090"

# --- Комиссия за использование инфраструктуры (опционально) ---
# Если commission_worker задан — за сутки на этот воркер уходит
# commission_percent% принятой работы (суммы сложностей шар), порциями. Изъятие идёт в ТОМ
# ЖЕ соединении майнера: на время изъятия прокси шлёт в пул служебный
# mining.authorize с commission_worker и подменяет воркер (params[0]) в шарах,
# сохраняя job_id/extranonce1; затем возвращает authorize на воркер майнера.
# Так пул привязывает воркер к authorize и засчитывает шары комиссии. Если
# переписать шару не удалось — комиссия не изымается (шара остаётся майнеру).
# Пустой commission_worker — комиссия выключена.
commission_worker: ""
commission_percent: 2

# commission_btc_only — по договору комиссия берётся только с добычи BTC.
# Соединения, где пул раздаёт задания другой монеты (BCH, LTC/DOGE, Kaspa…),
# проходят через прокси прозрачно: без служебных authorize, и их работа не
# входит в базу бюджета. Монета определяется по сетевой сложности из nbits
# в mining.notify (у BTC ~1e14, у остальных на порядки меньше), поэтому от IP
# пула не зависит. Монета пула видна в /status (поле "coin"). Дефолт true.
commission_btc_only: true

# Полные DNS-имена пулов, на которых разрешена комиссия.
# Сравнение без учёта регистра. Если домен неизвестен или неоднозначен,
# комиссия с подключения не берётся. Пустой список отключает фильтр.
commission_pools:
  - "ss.antpool.com"

# Режим изъятия (выберите один):
#   1) commission_interval — фиксированный интервал (например "10m").
#      Каждые N изымается доля, пропорциональная принятым за этот интервал
#      работе; превышение на последнюю целую шару уменьшает следующие порции.
#   2) commission_iteration — случайные моменты, не чаще N раз в сутки.
# commission_interval имеет приоритет: если он задан, commission_iteration
# не используется.
commission_interval: ""    # напр. "10m", "1m", "30s"
commission_iteration: 40

# commission_session — активное окно изъятия внутри commission_interval
# (например "20m" при interval "30m"). Если задано, в каждом интервале изъятие
# разрешено только внутри одного окна такой длины, начало которого выбирается
# случайно; вне окна шары не изымаются (бюджет переносится на следующее окно).
# Требует commission_interval и должно быть не больше него. Пусто — окно не
# применяется. Пример: interval "30m", session "20m" — каждые 30 минут изъятие
# идёт в течение случайных 20 минут.
commission_session: ""     # напр. "20m", "5m"

# Сложность комиссии. После переключения соединения на commission_worker
# прокси просит пул закрепить сложность на уровне майнера
# (mining.suggest_difficulty), чтобы vardiff не обесценивал изъятые шары.
# Запрос не задерживает submit, не чаще раза в 90 секунд на соединение, после
# "Frequency limit" — пауза 3 минуты. Комиссия идёт под commission_worker как
# есть, без ротации имени. Не настраивается.

# Пассивное определение домена по проходящим UDP-ответам DNS (нужен tcpdump).
# Включено по умолчанию, если заданы allowed_subnets.
# dns_passive: false

# Опциональный DNS-форвардер для определения домена подключения ASIC.
# dns_listen_addr: "192.168.1.1:53"
# dns_upstream: "192.168.1.2:53"
