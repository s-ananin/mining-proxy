# Пример конфигурации mining-proxy.
# Скопируйте в config.local.yaml (локально) или /etc/mining-proxy/config.yaml
# (systemd) и поправьте подсети майнеров.

# Адрес прокси — сюда приходит трафик майнеров после DNAT.
listen_addr: "0.0.0.0:8443"

# Реальный Stratum-пул (host:port). Нужен как fallback, если
# SO_ORIGINAL_DST недоступен (прямое подключение к прокси мимо iptables).
upstream_pool: "bs.poolbinance.com:3333"

# TLS при fallback-подключении. В прозрачном режиме TLS-сессию с пулом
# держит сам майнер (прокси — байтовая труба), поэтому здесь false.
upstream_ssl: false

# Подсети майнеров (CIDR), трафик которых перехватывается.
# Обязательны при setup_iptables: true.
allowed_subnets:
  - "10.4.6.0/24"

# Автоматически настроить iptables DNAT при старте (нужен root).
# При остановке правила снимаются: трафик уходит напрямую в пул.
setup_iptables: true

# Входящие интерфейсы вручную; пусто = автоопределение по маршруту
# к allowed_subnets.
# nat_ingress_ifaces:
#   - "eth1"

# Перехватывать весь TCP подсетей, а не только порт upstream_pool.
# Нужно, если майнеры ходят на разные порты разных пулов.
capture_all_tcp: false

# HTTP-мониторинг (/status, /health). Не выставляйте наружу без firewall.
monitor_addr: "127.0.0.1:9090"

# --- Комиссия за использование инфраструктуры (опционально) ---
# Если commission_worker задан — за сутки на этот воркер уходит
# commission_percent% принятых шар, порциями (итерациями). Изъятие идёт в ТОМ
# ЖЕ соединении майнера: на время изъятия прокси шлёт в пул служебный
# mining.authorize с commission_worker и подменяет воркер (params[0]) в шарах,
# сохраняя job_id/extranonce1; затем возвращает authorize на воркер майнера.
# Так пул привязывает воркер к authorize и засчитывает шары комиссии. Если
# переписать шару не удалось — комиссия не изымается (шара остаётся майнеру).
# Пустой commission_worker — комиссия выключена.
commission_worker: ""
commission_percent: 2

# Режим изъятия (выберите один):
#   1) commission_interval — фиксированный интервал (например "10m").
#      Каждые N изымается доля, пропорциональная принятым за этот интервал
#      шарам; суммарно за сутки не больше commission_percent%.
#   2) commission_iteration — случайные моменты, не чаще N раз в сутки.
# commission_interval имеет приоритет: если он задан, commission_iteration
# не используется.
commission_interval: ""    # напр. "10m", "1m", "30s"
commission_iteration: 40

# commission_session — активное окно изъятия внутри commission_interval
# (например "20m" при interval "30m"). Если задано, в каждом интервале изъятие
# разрешено только внутри одного окна такой длины, начало которого выбирается
# случайно; вне окна шары не изымаются (бюджет переносится на следующее окно).
# Требует commission_interval и должно быть не больше него. Пусто — окно не
# применяется. Пример: interval "30m", session "20m" — каждые 30 минут изъятие
# идёт в течение случайных 20 минут.
commission_session: ""     # напр. "20m", "5m"

# commission_worker_rotate — ротация имени воркера комиссии: в каждом окне
# изъятия используется новое имя ("anton425.r1", "anton425.r2" и т.д.).
# Нужно пулам с vardiff: сложность воркера падает в разы, если воркер шлёт
# мало шар (а комиссия шлёт их мало по определению) — тогда изъятые шары
# зачитываются в десятки раз дешевле и комиссия обесценивается. У нового
# имени истории нет, поэтому пул не трогает сложность сессии. Деньги идут на
# тот же аккаунт: пул берёт аккаунт из части имени до первой точки.
# Побочный эффект: в дашборде пула появится много воркеров (по одному на
# окно изъятия).
commission_worker_rotate: false

# commission_suggest_difficulty — после служебного authorize прокси просит
# у пула закрепить сложность сессии на уровне сложности майнера
# (mining.suggest_difficulty). Пул, не знающий метода, ответит ошибкой
# (или проигнорирует) — включайте только для проверенных пулов.
commission_suggest_difficulty: false
